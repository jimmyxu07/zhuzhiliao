<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>竹知了在线玩 - 线上竹知了互动玩具</title>
<meta name="description" content="在线体验竹知了玩具！拉动发出哇哇声，挑战转速PK，分享你的成绩卡。纯网页互动，无需下载。">
<meta property="og:title" content="竹知了在线玩 - 拉动你的屏幕，发出最哇的声音">
<meta property="og:description" content="在线体验竹知了玩具！拉动发出哇哇声，挑战转速PK，分享你的成绩卡。纯网页互动，无需下载。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="竹知了在线玩">
<meta name="twitter:description" content="拉动你的屏幕，发出最哇的声音！挑战转速PK，分享成绩卡。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎋</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="header">
    <h1 class="title">🎋 竹知了在线玩</h1>
    <p class="subtitle">拉动你的屏幕，发出最哇的声音</p>
  </header>

  <!-- Main Play Area -->
  <main class="play-area" id="playArea">
    <div class="cicada-container" id="cicadaContainer">
      <!-- SVG Bamboo Cicada -->
      <svg id="cicadaSvg" class="cicada-svg" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
        <!-- Body -->
        <ellipse cx="100" cy="160" rx="38" ry="55" fill="#8B6914" stroke="#6B4F12" stroke-width="2"/>
        <!-- Head -->
        <ellipse cx="100" cy="95" rx="28" ry="22" fill="#A07818" stroke="#6B4F12" stroke-width="2"/>
        <!-- Eyes -->
        <circle cx="86" cy="88" r="6" fill="#1a1a1a"/>
        <circle cx="114" cy="88" r="6" fill="#1a1a1a"/>
        <circle cx="88" cy="86" r="2" fill="white"/>
        <circle cx="116" cy="86" r="2" fill="white"/>
        <!-- Mouth -->
        <path d="M92 102 Q100 108 108 102" fill="none" stroke="#6B4F12" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Wing Left -->
        <g id="wingLeft" class="wing wing-left">
          <ellipse cx="52" cy="140" rx="52" ry="22" fill="rgba(196,178,128,0.7)" stroke="#B8A060" stroke-width="1.5" transform="rotate(-25 52 140)"/>
          <line x1="20" y1="148" x2="82" y2="132" stroke="#C4B280" stroke-width="1" transform="rotate(-25 52 140)"/>
          <line x1="28" y1="136" x2="78" y2="124" stroke="#C4B280" stroke-width="0.8" transform="rotate(-25 52 140)"/>
          <line x1="24" y1="158" x2="80" y2="144" stroke="#C4B280" stroke-width="0.8" transform="rotate(-25 52 140)"/>
        </g>
        <!-- Wing Right -->
        <g id="wingRight" class="wing wing-right">
          <ellipse cx="148" cy="140" rx="52" ry="22" fill="rgba(196,178,128,0.7)" stroke="#B8A060" stroke-width="1.5" transform="rotate(25 148 140)"/>
          <line x1="118" y1="132" x2="178" y2="148" stroke="#C4B280" stroke-width="1" transform="rotate(25 148 140)"/>
          <line x1="122" y1="124" x2="172" y2="136" stroke="#C4B280" stroke-width="0.8" transform="rotate(25 148 140)"/>
          <line x1="120" y1="144" x2="176" y2="158" stroke="#C4B280" stroke-width="0.8" transform="rotate(25 148 140)"/>
        </g>
        <!-- Legs -->
        <line x1="75" y1="175" x2="58" y2="210" stroke="#6B4F12" stroke-width="2" stroke-linecap="round"/>
        <line x1="88" y1="190" x2="72" y2="225" stroke="#6B4F12" stroke-width="2" stroke-linecap="round"/>
        <line x1="112" y1="190" x2="128" y2="225" stroke="#6B4F12" stroke-width="2" stroke-linecap="round"/>
        <line x1="125" y1="175" x2="142" y2="210" stroke="#6B4F12" stroke-width="2" stroke-linecap="round"/>
        <!-- String -->
        <line id="cicadaString" x1="100" y1="215" x2="100" y2="255" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="100" cy="257" r="4" fill="#6B4F12"/>
        <!-- Bamboo texture lines on body -->
        <line x1="68" y1="130" x2="132" y2="130" stroke="#7A5C10" stroke-width="0.8" opacity="0.5"/>
        <line x1="66" y1="145" x2="134" y2="145" stroke="#7A5C10" stroke-width="0.8" opacity="0.5"/>
        <line x1="66" y1="160" x2="134" y2="160" stroke="#7A5C10" stroke-width="0.8" opacity="0.5"/>
        <line x1="68" y1="175" x2="132" y2="175" stroke="#7A5C10" stroke-width="0.8" opacity="0.5"/>
      </svg>
      <!-- Pull hint -->
      <div class="pull-hint" id="pullHint">
        <span class="pull-arrow">↕</span>
        <span>按住拉动我！</span>
      </div>
    </div>

    <!-- Sound Visualizer -->
    <div class="sound-wave" id="soundWave">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </main>

  <!-- Mode Selector -->
  <section class="mode-selector">
    <h2 class="section-title">选择声音模式</h2>
    <div class="mode-buttons" id="modeButtons">
      <button class="mode-btn active" data-mode="wawa">
        <span class="mode-emoji">🎋</span>
        <span class="mode-name">哇哇</span>
        <span class="mode-desc">经典竹知了</span>
      </button>
      <button class="mode-btn" data-mode="gaga">
        <span class="mode-emoji">🦆</span>
        <span class="mode-name">嘎嘎</span>
        <span class="mode-desc">鸭子叫</span>
      </button>
      <button class="mode-btn" data-mode="dudu">
        <span class="mode-emoji">🚗</span>
        <span class="mode-name">嘟嘟</span>
        <span class="mode-desc">汽车喇叭</span>
      </button>
      <button class="mode-btn" data-mode="wengweng">
        <span class="mode-emoji">🐝</span>
        <span class="mode-name">嗡嗡</span>
        <span class="mode-desc">蜜蜂</span>
      </button>
    </div>
  </section>

  <!-- PK Score Section -->
  <section class="pk-section">
    <h2 class="section-title">🏃 转速PK</h2>
    <div class="pk-info">
      <div class="pk-card">
        <div class="pk-label">本次转速</div>
        <div class="pk-value" id="currentScore">0</div>
        <div class="pk-unit">次/秒</div>
      </div>
      <div class="pk-card">
        <div class="pk-label">个人最佳</div>
        <div class="pk-value" id="bestScore">0</div>
        <div class="pk-unit">次/秒</div>
      </div>
    </div>
    <div class="pk-rank-toggle" id="rankToggle">
      🏆 查看排行榜
    </div>
  </section>

  <!-- Leaderboard Modal -->
  <div class="modal-overlay" id="rankModal">
    <div class="modal">
      <div class="modal-header">
        <h3>🏆 全球排行榜</h3>
        <button class="modal-close" id="rankModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="rank-list" id="rankList"></div>
        <div class="rank-my" id="rankMy"></div>
      </div>
    </div>
  </div>

  <!-- Score Card Section -->
  <section class="card-section" id="cardSection" style="display:none;">
    <h2 class="section-title">📸 成绩卡</h2>
    <canvas id="scoreCardCanvas" width="600" height="400"></canvas>
    <div class="card-actions">
      <button class="btn btn-primary" id="downloadCard">📥 保存成绩卡</button>
      <button class="btn btn-secondary" id="shareCard">🔗 分享</button>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>🎋 竹知了在线玩 · 纯网页互动 · 无需下载</p>
    <p class="footer-sm">传统手工艺 × 现代互动 · 2026</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
